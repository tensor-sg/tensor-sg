name: Commit Grind

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["grind/**", ".github/workflows/commit-grind.yml"]

permissions:
  contents: write

jobs:
  grind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Roll loot and render card
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: a fine-grained PAT (read-only Contents + Metadata) so private-repo commits count.
          GH_TOKEN: ${{ secrets.GRIND_TOKEN || secrets.GITHUB_TOKEN }}
          GRIND_TZ: Asia/Kolkata
        run: python grind/grind.py
      - name: Commit card if changed
        run: |
          git config user.name "commit-grind[bot]"
          git config user.email "commit-grind[bot]@users.noreply.github.com"
          git add grind-card.svg grind-state.json README.md
          git diff --cached --quiet || git commit -m "chore: update commit grind card [skip ci]"
          git push
